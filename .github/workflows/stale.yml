name: Mark stale issues and pull requests

on:
  schedule:
    - cron: '30 1 * * *'
  workflow_dispatch:

jobs:
  stale:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write

    steps:
      - uses: actions/stale@v9
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

          # Issues inactive for 60 days are marked stale
          days-before-issue-stale: 60
          # Stale issues are closed after another 14 days without activity
          days-before-issue-close: 14

          # Pull requests follow the same schedule
          days-before-pr-stale: 60
          days-before-pr-close: 14

          stale-issue-label: 'stale'
          close-issue-label: 'wontfix'

          stale-issue-message: >
            This issue has been automatically marked as stale because it has not had
            recent activity. Here are some hints that may help:

            - If this is a **bug report**, please check whether the issue still
              reproduces on the latest version of pyflowchart.  If it does, feel
              free to leave a comment so it stays open.
            - If this is a **question**, you may find an answer in the
              [README](https://github.com/cdfmlr/pyflowchart#readme) or by
              searching existing issues.
            - If this is a **feature request** that you no longer need or that
              you think is out of scope, feel free to close it yourself.

            The issue will be closed in 14 days if no further activity occurs.
            Thank you for your contributions!

          close-issue-message: >
            This issue was closed automatically because it has been stale for 14
            days with no further activity.  If you believe this was done in error,
            or if the issue is still relevant, please reopen it and leave a comment.

          stale-pr-label: 'stale'

          stale-pr-message: >
            This pull request has been automatically marked as stale because it
            has not had recent activity.  It will be closed in 14 days if no
            further activity occurs.  Thank you for your contribution!

          close-pr-message: >
            This pull request was closed automatically because it has been stale
            for 14 days with no further activity.  Please reopen it if you would
            like to continue working on it.

          # Never auto-close issues that carry these labels
          exempt-issue-labels: 'pinned,security'
          exempt-pr-labels: 'pinned,security'

          # Only process a reasonable number of items per run to stay within
          # API rate limits
          operations-per-run: 100
